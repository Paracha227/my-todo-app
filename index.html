<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบแจ้งเตือนและจัดการงาน</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Sarabun', sans-serif; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen pb-12">

    <!-- Notification Banner -->
    <div id="notif-banner" class="bg-amber-500 text-white px-4 py-2 text-sm font-medium hidden flex justify-between items-center shadow-md">
        <div class="flex items-center space-x-2">
            <i class="fas fa-bell animate-bounce"></i>
            <span>เปิดใช้งานการแจ้งเตือนบนเบราว์เซอร์ เพื่อไม่ให้พลาดกำหนดส่งงานสำคัญ!</span>
        </div>
        <div class="flex items-center space-x-2">
            <button onclick="requestNotificationPermission()" class="bg-white text-amber-600 px-3 py-1 rounded-lg text-xs font-bold hover:bg-amber-50 transition">เปิดการแจ้งเตือน</button>
            <button onclick="closeBanner()" class="text-white hover:text-amber-200"><i class="fas fa-times"></i></button>
        </div>
    </div>

    <div class="max-w-5xl mx-auto px-4 py-6">
        <!-- Header -->
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8 bg-white p-6 rounded-2xl shadow-sm border border-slate-200/80">
            <div class="flex items-center space-x-4">
                <div class="w-12 h-12 bg-blue-600 rounded-xl flex items-center justify-center text-white shadow-lg shadow-blue-500/30">
                    <i class="fas fa-tasks text-xl"></i>
                </div>
                <div>
                    <h1 class="text-2xl font-bold text-slate-800">ระบบแจ้งเตือนและจัดการงาน</h1>
                    <p class="text-sm text-slate-500">วางแผนงานประจำวัน และติดตามงานที่ได้รับมอบหมาย</p>
                </div>
            </div>
            <div class="flex items-center space-x-3">
                <button onclick="openModal()" class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-4 py-2.5 rounded-xl shadow-md shadow-blue-500/20 transition flex items-center space-x-2">
                    <i class="fas fa-plus"></i>
                    <span>เพิ่มงานใหม่</span>
                </button>
            </div>
        </div>

        <!-- Dashboard Cards -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
            <div class="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm">
                <div class="flex items-center justify-between text-slate-500 mb-2">
                    <span class="text-xs font-semibold uppercase tracking-wider">งานทั้งหมด</span>
                    <div class="w-8 h-8 rounded-lg bg-slate-100 flex items-center justify-center text-slate-600">
                        <i class="fas fa-list-ul"></i>
                    </div>
                </div>
                <div class="text-2xl font-bold text-slate-800" id="stat-total">0</div>
            </div>

            <div class="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm">
                <div class="flex items-center justify-between text-amber-600 mb-2">
                    <span class="text-xs font-semibold uppercase tracking-wider">รอดำเนินการ</span>
                    <div class="w-8 h-8 rounded-lg bg-amber-50 flex items-center justify-center text-amber-600">
                        <i class="fas fa-clock"></i>
                    </div>
                </div>
                <div class="text-2xl font-bold text-slate-800" id="stat-pending">0</div>
            </div>

            <div class="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm">
                <div class="flex items-center justify-between text-emerald-600 mb-2">
                    <span class="text-xs font-semibold uppercase tracking-wider">เสร็จสิ้นแล้ว</span>
                    <div class="w-8 h-8 rounded-lg bg-emerald-50 flex items-center justify-center text-emerald-600">
                        <i class="fas fa-check-circle"></i>
                    </div>
                </div>
                <div class="text-2xl font-bold text-slate-800" id="stat-completed">0</div>
            </div>

            <div class="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm">
                <div class="flex items-center justify-between text-rose-600 mb-2">
                    <span class="text-xs font-semibold uppercase tracking-wider">เกินกำหนดส่ง</span>
                    <div class="w-8 h-8 rounded-lg bg-rose-50 flex items-center justify-center text-rose-600">
                        <i class="fas fa-exclamation-triangle"></i>
                    </div>
                </div>
                <div class="text-2xl font-bold text-slate-800" id="stat-overdue">0</div>
            </div>
        </div>

        <!-- Task List Container -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200/80 overflow-hidden">
            <!-- Search & Filters -->
            <div class="p-4 border-b border-slate-100 bg-slate-50/50 flex flex-col md:flex-row gap-3">
                <div class="relative flex-1">
                    <i class="fas fa-search absolute left-3.5 top-3 text-slate-400"></i>
                    <input type="text" id="search-input" oninput="renderTasks()" placeholder="ค้นหางาน..." class="w-full pl-10 pr-4 py-2 bg-white border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500">
                </div>
                <div class="flex gap-2">
                    <select id="filter-repeat" onchange="renderTasks()" class="bg-white border border-slate-200 rounded-xl px-3 py-2 text-sm text-slate-600 focus:outline-none focus:ring-2 focus:ring-blue-500/20">
                        <option value="all">รูปแบบงานทั้งหมด</option>
                        <option value="daily">งานซ้ำทุกวัน</option>
                        <option value="once">งานทำครั้งเดียว</option>
                    </select>
                    <select id="filter-status" onchange="renderTasks()" class="bg-white border border-slate-200 rounded-xl px-3 py-2 text-sm text-slate-600 focus:outline-none focus:ring-2 focus:ring-blue-500/20">
                        <option value="all">สถานะทั้งหมด</option>
                        <option value="pending">รอดำเนินการ</option>
                        <option value="completed">เสร็จสิ้น</option>
                    </select>
                </div>
            </div>

            <!-- Task Items -->
            <div id="task-list" class="divide-y divide-slate-100">
                <!-- Task Items Will Be Rendered Here -->
            </div>
        </div>
    </div>

    <!-- Add/Edit Task Modal -->
    <div id="task-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl border border-slate-100">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-lg font-bold text-slate-800" id="modal-title">เพิ่มงานใหม่</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600"><i class="fas fa-times text-xl"></i></button>
            </div>

            <form id="task-form" onsubmit="saveTask(event)">
                <input type="hidden" id="task-id">
                
                <div class="space-y-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-2">ชื่อชื่องาน / รายการที่ต้องทำ</label>
                        <input type="text" id="task-title" required placeholder="เช่น บันทึกสวัสดิการ แบบ 7105" class="w-full px-4 py-2.5 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 outline-none">
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-2">ลิงก์ระบบงาน (ถ้ามี)</label>
                        <input type="url" id="task-link" placeholder="https://..." class="w-full px-4 py-2.5 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 outline-none">
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-2">รูปแบบการทำซ้ำ</label>
                            <select id="task-repeat" onchange="toggleDateInput()" class="w-full px-4 py-2.5 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 outline-none bg-white">
                                <option value="daily">🔄 ทำซ้ำทุกวัน (Daily)</option>
                                <option value="once">📅 ทำครั้งเดียว (Specific Date)</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-2">เวลาแจ้งเตือน</label>
                            <input type="time" id="task-time" required class="w-full px-4 py-2.5 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 outline-none">
                        </div>
                    </div>

                    <div id="date-container" class="hidden">
                        <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-2">วันที่กำหนดส่ง</label>
                        <input type="date" id="task-date" class="w-full px-4 py-2.5 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 outline-none">
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-2">รายละเอียดเพิ่มเติม</label>
                        <textarea id="task-desc" rows="3" placeholder="ระบุรายละเอียดเพิ่มเติม..." class="w-full px-4 py-2.5 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 outline-none"></textarea>
                    </div>
                </div>

                <div class="mt-6 flex justify-end space-x-3">
                    <button type="button" onclick="closeModal()" class="px-4 py-2.5 rounded-xl border border-slate-200 text-slate-600 font-medium text-sm hover:bg-slate-50">ยกเลิก</button>
                    <button type="submit" class="px-5 py-2.5 rounded-xl bg-blue-600 text-white font-medium text-sm hover:bg-blue-700 shadow-md shadow-blue-500/20">บันทึกข้อมูล</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let tasks = JSON.parse(localStorage.getItem('my_tasks') || '[]');

        // Check Notification Permission
        document.addEventListener('DOMContentLoaded', () => {
            checkNotificationStatus();
            renderTasks();
            setInterval(checkTaskReminders, 30000); // Check every 30 secs
        });

        function checkNotificationStatus() {
            if ("Notification" in window) {
                if (Notification.permission !== "granted") {
                    document.getElementById('notif-banner').classList.remove('hidden');
                }
            }
        }

        function requestNotificationPermission() {
            if ("Notification" in window) {
                Notification.requestPermission().then(permission => {
                    if (permission === "granted") {
                        document.getElementById('notif-banner').classList.add('hidden');
                        new Notification("เปิดการแจ้งเตือนสำเร็จ!", { body: "ระบบจะส่งการแจ้งเตือนเมื่อถึงเวลาทำงาน" });
                    }
                });
            }
        }

        function closeBanner() {
            document.getElementById('notif-banner').classList.add('hidden');
        }

        function toggleDateInput() {
            const repeat = document.getElementById('task-repeat').value;
            const dateContainer = document.getElementById('date-container');
            if (repeat === 'once') {
                dateContainer.classList.remove('hidden');
                document.getElementById('task-date').required = true;
            } else {
                dateContainer.classList.add('hidden');
                document.getElementById('task-date').required = false;
            }
        }

        function openModal(taskId = null) {
            document.getElementById('task-form').reset();
            document.getElementById('task-id').value = '';
            document.getElementById('modal-title').innerText = 'เพิ่มงานใหม่';
            toggleDateInput();

            if (taskId) {
                const task = tasks.find(t => t.id === taskId);
                if (task) {
                    document.getElementById('task-id').value = task.id;
                    document.getElementById('task-title').value = task.title;
                    document.getElementById('task-link').value = task.link || '';
                    document.getElementById('task-repeat').value = task.repeat || 'once';
                    document.getElementById('task-time').value = task.time;
                    document.getElementById('task-date').value = task.date || '';
                    document.getElementById('task-desc').value = task.desc || '';
                    document.getElementById('modal-title').innerText = 'แก้ไขงาน';
                    toggleDateInput();
                }
            }

            document.getElementById('task-modal').classList.remove('hidden');
            document.getElementById('task-modal').classList.add('flex');
        }

        function closeModal() {
            document.getElementById('task-modal').classList.add('hidden');
            document.getElementById('task-modal').classList.remove('flex');
        }

        function saveTask(e) {
            e.preventDefault();
            const id = document.getElementById('task-id').value || Date.now().toString();
            const title = document.getElementById('task-title').value;
            const link = document.getElementById('task-link').value;
            const repeat = document.getElementById('task-repeat').value;
            const time = document.getElementById('task-time').value;
            const date = repeat === 'once' ? document.getElementById('task-date').value : new Date().toISOString().split('T')[0];
            const desc = document.getElementById('task-desc').value;

            const existingIndex = tasks.findIndex(t => t.id === id);
            const taskData = {
                id, title, link, repeat, time, date, desc,
                completed: false,
                notified: false
            };

            if (existingIndex > -1) {
                tasks[existingIndex] = { ...tasks[existingIndex], ...taskData };
            } else {
                tasks.push(taskData);
            }

            localStorage.setItem('my_tasks', JSON.stringify(tasks));
            closeModal();
            renderTasks();
        }

        function toggleComplete(id) {
            const task = tasks.find(t => t.id === id);
            if (task) {
                if (task.repeat === 'daily') {
                    // If daily task completed, set date to tomorrow for next reminder
                    const tomorrow = new Date();
                    tomorrow.setDate(tomorrow.getDate() + 1);
                    task.date = tomorrow.toISOString().split('T')[0];
                    task.notified = false;
                    task.completed = false; // keep active for tomorrow
                    alert("เก่งมาก! ทำงานประจำวันนี้เรียบร้อยแล้ว ระบบจะตั้งเตือนสำหรับวันพรุ่งนี้ให้อัตโนมัติครับ");
                } else {
                    task.completed = !task.completed;
                }
                localStorage.setItem('my_tasks', JSON.stringify(tasks));
                renderTasks();
            }
        }

        function deleteTask(id) {
            if (confirm('คุณต้องการลบรายการนี้ใช่หรือไม่?')) {
                tasks = tasks.filter(t => t.id !== id);
                localStorage.setItem('my_tasks', JSON.stringify(tasks));
                renderTasks();
            }
        }

        function renderTasks() {
            const search = document.getElementById('search-input').value.toLowerCase();
            const repeatFilter = document.getElementById('filter-repeat').value;
            const statusFilter = document.getElementById('filter-status').value;

            const filtered = tasks.filter(t => {
                const matchSearch = t.title.toLowerCase().includes(search);
                const matchRepeat = repeatFilter === 'all' || t.repeat === repeatFilter;
                const matchStatus = statusFilter === 'all' || 
                                    (statusFilter === 'completed' && t.completed) ||
                                    (statusFilter === 'pending' && !t.completed);
                return matchSearch && matchRepeat && matchStatus;
            });

            // Stats
            document.getElementById('stat-total').innerText = tasks.length;
            document.getElementById('stat-pending').innerText = tasks.filter(t => !t.completed).length;
            document.getElementById('stat-completed').innerText = tasks.filter(t => t.completed).length;
            
            const todayStr = new Date().toISOString().split('T')[0];
            document.getElementById('stat-overdue').innerText = tasks.filter(t => !t.completed && t.date < todayStr && t.repeat === 'once').length;

            const listEl = document.getElementById('task-list');
            if (filtered.length === 0) {
                listEl.innerHTML = `<div class="p-8 text-center text-slate-400">ไม่พบรายการงาน</div>`;
                return;
            }

            listEl.innerHTML = filtered.map(t => `
                <div class="p-4 flex items-center justify-between hover:bg-slate-50 transition">
                    <div class="flex items-start space-x-3">
                        <button onclick="toggleComplete('${t.id}')" class="mt-1 text-slate-300 hover:text-emerald-500 transition">
                            <i class="fas ${t.completed ? 'fa-check-circle text-emerald-500' : 'fa-circle'} text-xl"></i>
                        </button>
                        <div>
                            <div class="flex items-center space-x-2">
                                <h4 class="font-semibold text-slate-800 ${t.completed ? 'line-through text-slate-400' : ''}">${t.title}</h4>
                                <span class="text-xs px-2 py-0.5 rounded-md font-medium ${t.repeat === 'daily' ? 'bg-purple-100 text-purple-700' : 'bg-blue-100 text-blue-700'}">
                                    ${t.repeat === 'daily' ? '🔄 ทำซ้ำทุกวัน' : '📅 ครั้งเดียว'}
                                </span>
                            </div>
                            ${t.desc ? `<p class="text-xs text-slate-500 mt-1">${t.desc}</p>` : ''}
                            <div class="flex items-center space-x-4 mt-2 text-xs text-slate-400">
                                <span><i class="far fa-clock mr-1"></i>${t.time} น.</span>
                                ${t.repeat === 'once' ? `<span><i class="far fa-calendar mr-1"></i>${t.date}</span>` : ''}
                                ${t.link ? `<a href="${t.link}" target="_blank" class="text-blue-600 hover:underline"><i class="fas fa-external-link-alt mr-1"></i>เปิดลิงก์ระบบ</a>` : ''}
                            </div>
                        </div>
                    </div>
                    <div class="flex space-x-2">
                        <button onclick="openModal('${t.id}')" class="text-slate-400 hover:text-blue-600 p-2"><i class="fas fa-edit"></i></button>
                        <button onclick="deleteTask('${t.id}')" class="text-slate-400 hover:text-rose-600 p-2"><i class="fas fa-trash-alt"></i></button>
                    </div>
                </div>
            `).join('');
        }

        function checkTaskReminders() {
            const now = new Date();
            const currentTime = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
            const currentDate = now.toISOString().split('T')[0];

            tasks.forEach(task => {
                if (!task.completed && task.time === currentTime && !task.notified) {
                    if (task.repeat === 'daily' || task.date === currentDate) {
                        sendBrowserNotification(task);
                        task.notified = true;
                        localStorage.setItem('my_tasks', JSON.stringify(tasks));
                    }
                }
            });
        }

        function sendBrowserNotification(task) {
            if ("Notification" in window && Notification.permission === "granted") {
                new Notification(`🔔 ถึงเวลาทำงาน: ${task.title}`, {
                    body: task.desc || `กำหนดเวลา ${task.time} น.`,
                    icon: 'https://cdn-icons-png.flaticon.com/512/3112/3112933.png'
                });
            }
        }
    </script>
</body>
</html>
